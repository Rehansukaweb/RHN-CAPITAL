<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark light">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no">
<title>RHN GALLERY | Mobile & Web App</title>

<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="RHN LOGO.jpg">

<style>
/* ==========================================================================
   TEMA UI RESPONSIVE (HP & LAPTOP) - FULL GALLERY MODE
   ========================================================================== */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: 'Outfit', sans-serif; }

:root {
  --bg: #000000;
  --card: #121215;
  --bg-input: #1A1A1F;
  --text: #FFFFFF;
  --text2: #888899;
  --gold: #FBBF24;
  --green: #10B981;
  --red: #F87171;
  --border: #222228;
  --body-bg: #050505;
  --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);
}

html { scroll-behavior: smooth; }

body {
  background-color: var(--body-bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ANTI NGEDET/GESER SWEETALERT */
body.swal2-shown { padding-right: 0 !important; }
body.swal2-shown:not(.swal2-no-backdrop):not(.swal2-toast-shown) { overflow: visible !important; }
.swal2-container { z-index: 100000 !important; }
.swal2-popup { border-radius: 20px !important; background: var(--card) !important; color: var(--text) !important; border: 1px solid var(--border); }
.swal2-timer-progress-bar { background: var(--gold) !important; }

/* WRAPPER UTAMA BIAR RAPIH DI LAPTOP */
.app-wrapper {
  max-width: 600px;
  margin: 0 auto;
  background-color: var(--bg);
  min-height: 100vh;
  position: relative;
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  padding-bottom: 80px;
  box-shadow: 0 0 40px rgba(0,0,0,0.8);
  overflow-x: hidden;
}

/* ---------------------------------------------------
   ANIMASI SPLASH SCREEN & TRANSISI HALUS
   Catatan: hanya SATU sumber animasi per elemen di satu waktu,
   supaya tidak ada tabrakan class fade-in/fade-out yang bikin "ngedet".
   --------------------------------------------------- */
.fade-in { animation: fadeInSmooth 0.45s var(--ease-smooth) forwards; }
.fade-out { animation: fadeOutSmooth 0.35s var(--ease-smooth) forwards; pointer-events: none; }
@keyframes fadeInSmooth { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeOutSmooth { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-8px); } }

#splash-screen { position: absolute; inset: 0; background: #050505; z-index: 999999; display: flex; align-items: center; justify-content: center; }
#splash-screen.splash-exit { animation: splashSlideUpOut 0.7s var(--ease-smooth) forwards; pointer-events: none; }
@keyframes splashSlideUpOut { to { transform: translateY(-100%); opacity: 0; visibility: hidden; } }
.splash-content { display: flex; flex-direction: column; align-items: center; }
.splash-logo-minimal { width: 90px; height: 90px; border-radius: 24px; border: 2px solid var(--gold); padding: 4px; opacity: 0; transform: translateY(20px); animation: fadeUpItem 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.1s; object-fit: cover; }
.splash-text-group { margin-top: 24px; text-align: center; opacity: 0; transform: translateY(20px); animation: fadeUpItem 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s; }
.splash-title-minimal { font-size: 28px; font-weight: 800; color: #fff; letter-spacing: 4px; margin-bottom: 6px; }
.splash-subtitle-minimal { font-size: 11px; font-weight: 700; color: var(--gold); letter-spacing: 5px; text-transform: uppercase; }
.splash-line-loader { width: 0%; height: 2px; background: var(--gold); margin-top: 32px; border-radius: 2px; animation: expandLine 0.8s cubic-bezier(0.7, 0, 0.3, 1) forwards 0.3s; }
@keyframes fadeUpItem { to { opacity: 1; transform: translateY(0); } }
@keyframes expandLine { 0% { width: 0%; opacity: 0; } 10% { opacity: 1; } 100% { width: 150px; opacity: 0; } }

/* ---------------------------------------------------
   AUTH SCREEN & PIN
   --------------------------------------------------- */
.screen-layer { position: absolute; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 9999; flex-direction: column; }
.auth-box { background: var(--card); border-radius: 24px; padding: 40px 24px; width: 90%; max-width: 400px; border: 1px solid var(--border); text-align: center; box-shadow: 0 12px 32px rgba(0,0,0,0.5); }
.auth-box img { width: 70px; height: 70px; border-radius: 18px; margin-bottom: 16px; border: 1px solid var(--border); object-fit: cover; }
.auth-title { font-size: 22px; font-weight: 800; color: var(--text); margin-bottom: 4px; letter-spacing: 1px; }
.auth-sub { font-size: 12px; color: var(--text2); margin-bottom: 24px; }
.auth-tabs { display: flex; background: var(--bg-input); border-radius: 12px; padding: 4px; margin-bottom: 24px; }
.auth-tab { flex: 1; padding: 12px; font-size: 12px; font-weight: 700; cursor: pointer; background: transparent; border: none; color: var(--text2); border-radius: 8px; transition: 0.25s var(--ease-smooth); }
.auth-tab.active { background: var(--card); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,0.2); }

.input-wrap { position: relative; }
.f-input-dark { width: 100%; padding: 16px; border-radius: 16px; border: 1px solid var(--border); background-color: var(--bg-input) !important; color: var(--text) !important; outline: none; font-size: 14px; margin-bottom: 12px; font-weight: 500; transition: border-color 0.2s ease, box-shadow 0.2s ease; }
.input-wrap .f-input-dark { padding-right: 46px; }
.f-input-dark:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(251,191,36,0.12); }
.field-hint { font-size: 11px; color: var(--red); text-align: left; margin: -6px 0 10px 4px; min-height: 14px; opacity: 0; transition: opacity 0.2s ease; }
.field-hint.show { opacity: 1; }
.toggle-eye { position: absolute; right: 6px; top: 0; height: 100%; width: 40px; background: none; border: none; color: var(--text2); cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; transition: color 0.2s ease, transform 0.15s ease; }
.toggle-eye:active { transform: scale(0.88); }
.toggle-eye.is-visible { color: var(--gold); }

.submit-btn { width: 100%; padding: 16px; background: var(--text); color: var(--bg); border: none; border-radius: 16px; font-size: 13px; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease, opacity 0.2s ease; letter-spacing: 1px; margin-top: 5px; }
.submit-btn:hover { background: var(--gold); color: #000; }
.submit-btn:active { transform: scale(0.97); }
.submit-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

/* MAIN UI STYLING */
.mobile-header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: 14px 16px; background: var(--bg); position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--border); }
.header-left { grid-column: 1; }
.header-center { grid-column: 2; display: flex; align-items: center; justify-content: center; gap: 9px; }
.header-right { grid-column: 3; display: flex; align-items: center; justify-content: flex-end; gap: 8px; opacity: 0; transform: translateY(-4px); pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease; }
.header-right.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
.header-logo { width: 34px; height: 34px; border-radius: 10px; object-fit: cover; border: 1px solid var(--gold); flex-shrink: 0; }
.header-title { font-size: 15px; font-weight: 700; color: var(--gold); letter-spacing: 1px; white-space: nowrap; }
.page-main-title { font-size: 28px; font-weight: 500; margin: 15px 20px 20px; color: var(--text); }
.photo-count-badge { font-size: 10px; font-weight: 700; color: var(--text2); background: var(--card); border: 1px solid var(--border); padding: 5px 9px; border-radius: 20px; white-space: nowrap; line-height: 1.4; }
.photo-count-badge .badge-size { color: var(--gold); }
.download-all-btn { width: 32px; height: 32px; border-radius: 50%; background: var(--card); border: 1px solid var(--border); color: var(--gold); font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s ease, transform 0.15s ease, border-color 0.2s ease; flex-shrink: 0; }
.download-all-btn:hover { border-color: var(--gold); }
.download-all-btn:active { transform: scale(0.9); }

/* GRID FOTO RESPONSIVE */
.album-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 0 4px 20px; }
@media (min-width: 480px) { .album-grid { grid-template-columns: repeat(4, 1fr); } }
.album-card { position: relative; cursor: pointer; aspect-ratio: 1/1; overflow: hidden; background: var(--card); border-radius: 4px; }
.album-cover { width: 100%; height: 100%; object-fit: cover; transition: transform 0.35s var(--ease-smooth), opacity 0.3s ease; opacity: 0; }
.album-cover.loaded { opacity: 1; }
.album-card:hover .album-cover { transform: scale(1.08); }
.album-card:active .album-cover { transform: scale(0.96); }

.skeleton-box { background: linear-gradient(100deg, var(--card) 30%, var(--bg-input) 50%, var(--card) 70%); background-size: 250% 100%; animation: skeletonPulse 1.3s ease infinite; }
@keyframes skeletonPulse { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

.empty-state { grid-column: 1/-1; text-align: center; padding: 60px 30px; color: var(--text2); }
.empty-state .emoji { font-size: 40px; display: block; margin-bottom: 14px; opacity: 0.7; }
.empty-state .title { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.empty-state .sub { font-size: 12px; }

/* BOTTOM NAVIGATION */
.bottom-nav { position: absolute; bottom: 0; width: 100%; background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(15px); display: flex; justify-content: space-around; align-items: center; padding: 10px 0 15px 0; border-top: 1px solid var(--border); z-index: 50; }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text2); font-size: 11px; cursor: pointer; background: none; border: none; font-weight: 600; transition: color 0.25s ease, transform 0.15s ease; }
.nav-item:active { transform: scale(0.9); }
.nav-item .icon { font-size: 22px; filter: grayscale(1); opacity: 0.6; transition: filter 0.25s ease, opacity 0.25s ease, transform 0.25s var(--ease-smooth); }
.nav-item.active { color: var(--gold); }
.nav-item.active .icon { filter: grayscale(0); opacity: 1; transform: translateY(-2px); }

.page { display: none; }
.page.active { display: block; animation: fadeInSmooth 0.35s var(--ease-smooth) forwards; }

.card-form { background: var(--card); border-radius: 20px; padding: 20px; margin: 0 20px 20px; border: 1px solid var(--border); }
.menu-btn { width: 100%; padding: 16px; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 10px; text-align: left; display: flex; gap: 15px; align-items: center; transition: background 0.2s ease, transform 0.15s ease; }
.menu-btn:hover { background: var(--bg-input); }
.menu-btn:active { transform: scale(0.98); }
.menu-btn.danger { color: var(--red); border-color: rgba(248,113,113,0.3); }
.menu-btn:last-child { margin-bottom: 0; }

.upload-hint { font-size: 11px; color: var(--text2); margin: -6px 0 15px 2px; line-height: 1.6; }

/* PREVIEW THUMBNAIL SEBELUM UPLOAD */
#file-preview-list { display: none; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
.preview-thumb { position: relative; aspect-ratio: 1/1; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); animation: fadeInSmooth 0.3s var(--ease-smooth) forwards; }
.preview-thumb img { width: 100%; height: 100%; object-fit: cover; }
.preview-remove { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 50%; background: rgba(0,0,0,0.7); color: #fff; border: none; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s ease, transform 0.15s ease; }
.preview-remove:active { transform: scale(0.85); }
.preview-remove:hover { background: var(--red); }

/* PHOTO VIEWER FULL SCREEN */
#photo-viewer { position: absolute; inset: 0; background: #000; z-index: 99999; display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
#photo-viewer.show { opacity: 1; pointer-events: auto; }
.viewer-header { display: flex; align-items: center; gap: 12px; padding: max(15px, env(safe-area-inset-top)) 20px 45px; background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.45) 55%, transparent 100%); position: absolute; top: 0; left: 0; right: 0; z-index: 2; }
.viewer-icon-btn { flex-shrink: 0; background: rgba(255,255,255,0.1); width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.18); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(10px); box-shadow: 0 4px 14px rgba(0,0,0,0.35); transition: transform 0.15s ease, background 0.2s ease; }
.viewer-icon-btn svg { width: 22px; height: 22px; }
.viewer-icon-btn:active { transform: scale(0.88); background: rgba(255,255,255,0.2); }
.viewer-title { color: #fff; font-size: 13px; font-weight: 600; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.viewer-content { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; width: 100%; }
#viewer-img { max-width: 100%; max-height: 100%; transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.25s ease; cursor: zoom-in; transform-origin: center center; object-fit: contain; opacity: 0; }
#viewer-img.loaded { opacity: 1; }
#viewer-img.zoomed { transform: scale(3); cursor: zoom-out; }

.viewer-footer { position: absolute; bottom: 0; left: 0; right: 0; z-index: 2; display: flex; gap: 12px; padding: 24px 20px max(20px, env(safe-area-inset-bottom)); background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.5) 60%, transparent 100%); }
.viewer-action-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(10px); color: #fff; padding: 12px 8px; border-radius: 18px; font-size: 11px; font-weight: 700; letter-spacing: 0.3px; cursor: pointer; transition: background 0.2s ease, transform 0.15s ease; }
.viewer-action-btn .viewer-action-icon { font-size: 19px; }
.viewer-action-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.16); }
.viewer-action-btn.danger { color: var(--red); border-color: rgba(248,113,113,0.28); }
.viewer-action-btn.danger:active { background: rgba(248,113,113,0.15); }

/* SHAKE UNTUK PIN SALAH */
@keyframes shakeError { 10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(4px); } 30%, 50%, 70% { transform: translateX(-8px); } 40%, 60% { transform: translateX(8px); } }
.shake { animation: shakeError 0.5s var(--ease-smooth); }
</style>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<div class="app-wrapper">

  <div id="splash-screen">
    <div class="splash-content">
      <img src="RHN LOGO.jpg" alt="RHN Logo" class="splash-logo-minimal" onerror="this.onerror=null;this.src=window.RHN_FALLBACK_LOGO;">
      <div class="splash-text-group">
        <div class="splash-title-minimal">RHN GALLERY</div>
        <div class="splash-subtitle-minimal">KOLEKSI MEDIA PRIBADI</div>
      </div>
      <div class="splash-line-loader"></div>
    </div>
  </div>

  <div id="auth-screen" class="screen-layer" style="display:none;">
    <div class="auth-box">
      <img src="RHN LOGO.jpg" onerror="this.onerror=null;this.src=window.RHN_FALLBACK_LOGO;">
      <div class="auth-title">RHN GALLERY</div>
      <div class="auth-sub">Akses Masuk Ke Galeri</div>

      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Masuk</button>
        <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Daftar</button>
      </div>

      <input type="email" id="auth-email" class="f-input-dark" placeholder="Email" autocomplete="email" autocapitalize="none">

      <div class="input-wrap">
        <input type="password" id="auth-pass" class="f-input-dark" placeholder="Sandi" autocomplete="current-password">
        <button type="button" class="toggle-eye" onclick="togglePassVis('auth-pass', this)" aria-label="Tampilkan sandi">👁</button>
      </div>

      <div class="input-wrap" id="wrap-pass2" style="display:none;">
        <input type="password" id="auth-pass2" class="f-input-dark" placeholder="Ulangi Sandi" autocomplete="new-password">
        <button type="button" class="toggle-eye" onclick="togglePassVis('auth-pass2', this)" aria-label="Tampilkan sandi">👁</button>
      </div>

      <div class="field-hint" id="auth-hint"></div>

      <button class="submit-btn" id="btn-auth-submit" onclick="doAuth()">MASUK</button>
    </div>
  </div>

  <div id="pin-screen" class="screen-layer" style="display:none;">
    <div class="auth-box">
      <img src="RHN LOGO.jpg" onerror="this.onerror=null;this.src=window.RHN_FALLBACK_LOGO;">
      <div class="auth-title" id="pin-title">Masukkan PIN</div>
      <div class="auth-sub">Keamanan 6 Digit Media</div>
      <input type="password" id="app-pin" class="f-input-dark" style="text-align:center; letter-spacing:15px; font-size:24px; font-weight:800;" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="••••••">
      <div style="display:flex; justify-content:space-between; margin-top:20px;">
        <button style="background:none; border:none; color:var(--text2); font-weight: 700; font-size:11px; text-transform:uppercase; cursor:pointer;" onclick="konfirmasiAksi('Keluar akun?', doLogout)">Ganti Akun</button>
      </div>
    </div>
  </div>

  <div id="app-screen" style="display:none; width: 100%; height: 100%;">

    <div class="mobile-header">
      <div class="header-left"></div>
      <div class="header-center">
        <img src="RHN LOGO.jpg" class="header-logo" onerror="this.onerror=null;this.src=window.RHN_FALLBACK_LOGO;">
        <div class="header-title">RHN GALLERY</div>
      </div>
      <div class="header-right" id="header-gallery-stats">
        <button class="download-all-btn" id="btn-download-all" title="Unduh semua foto ke galeri HP" onclick="konfirmasiAksi('Unduh semua foto langsung ke galeri HP kamu?', downloadAllPhotos)">⬇️</button>
        <span class="photo-count-badge" id="photo-count-badge">0 foto</span>
      </div>
    </div>

    <div class="main-content">
      <div id="page-galeri" class="page active">
        <div class="page-main-title">Semua Foto</div>
        <div class="album-grid" id="main-gallery-grid"></div>
      </div>

      <div id="page-tambah" class="page">
        <div class="page-main-title">Upload Foto</div>
        <div class="card-form">
          <input type="file" id="f-img-file" class="f-input-dark" accept="image/*" multiple style="padding: 12px; background: rgba(255,255,255,0.05) !important;">
          <div class="upload-hint">Bisa pilih lebih dari satu foto sekaligus. Foto otomatis dikompres biar hemat kuota &amp; tetap tajam.</div>
          <div id="file-preview-list"></div>
          <input type="text" id="f-img-title" class="f-input-dark" placeholder="Judul / Nama File (Opsional)">
          <button class="submit-btn" id="btn-upload" onclick="konfirmasiAksi('Simpan foto-foto ini ke galeri?', tambahFotoBaru)">SIMPAN KE GALERI</button>
        </div>
      </div>

      <div id="page-pengaturan" class="page">
        <div class="page-main-title">Setelan</div>
        <div class="card-form">
          <button class="menu-btn" style="margin-bottom:10px;" onclick="konfirmasiAksi('Ganti PIN keamanan?', changePinInApp)">🔐 Ganti PIN</button>
          <button class="menu-btn danger" onclick="konfirmasiAksi('Yakin ingin keluar dari galeri?', doLogout)">🚪 Keluar Akun</button>
        </div>
      </div>
    </div>

    <div class="bottom-nav">
      <button class="nav-btn nav-item active" onclick="switchPage('galeri')">
        <span class="icon">🖼️</span>
        Galeri
      </button>
      <button class="nav-btn nav-item" onclick="switchPage('tambah')">
        <span class="icon">➕</span>
        Upload
      </button>
      <button class="nav-btn nav-item" onclick="switchPage('pengaturan')">
        <span class="icon">⚙️</span>
        Setelan
      </button>
    </div>
  </div>

  <div id="photo-viewer">
    <div class="viewer-header">
      <button class="viewer-icon-btn" onclick="tutupViewer()" aria-label="Kembali">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      </button>
      <div class="viewer-title" id="viewer-title-text"></div>
    </div>
    <div class="viewer-content">
      <img id="viewer-img" src="" onclick="toggleZoom(event)" onload="this.classList.add('loaded')">
    </div>
    <div class="viewer-footer">
      <button class="viewer-action-btn" onclick="aksiUnduh()">
        <span class="viewer-action-icon">⬇️</span>
        <span>Unduh</span>
      </button>
      <button class="viewer-action-btn danger" onclick="aksiHapus()">
        <span class="viewer-action-icon">🗑️</span>
        <span>Hapus</span>
      </button>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

window.konfirmasiAksi = function(pesan, callback) {
  customSwal.fire({
    title: 'Konfirmasi',
    text: pesan,
    icon: 'question',
    showCancelButton: true,
    confirmButtonColor: '#FBBF24',
    cancelButtonColor: '#222228',
    confirmButtonText: '<span style="color:#000; font-weight:800;">Ya, Lanjut</span>',
    cancelButtonText: 'Batal',
    background: 'var(--card)', color: 'var(--text)'
  }).then((result) => {
    if (result.isConfirmed) callback();
  });
};

window.switchPage = function(p) {
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('page-' + p).classList.add('active');

  if (p === 'galeri') document.querySelectorAll('.nav-btn')[0].classList.add('active');
  if (p === 'tambah') document.querySelectorAll('.nav-btn')[1].classList.add('active');
  if (p === 'pengaturan') document.querySelectorAll('.nav-btn')[2].classList.add('active');

  document.getElementById('header-gallery-stats').classList.toggle('show', p === 'galeri' && photos.length > 0);
};

window.switchTab = function(mode) {
  authMode = mode;
  document.getElementById('tab-login').classList.toggle('active', mode === 'login');
  document.getElementById('tab-register').classList.toggle('active', mode === 'register');
  document.getElementById('wrap-pass2').style.display = mode === 'register' ? 'block' : 'none';
  document.getElementById('btn-auth-submit').textContent = mode === 'login' ? 'MASUK' : 'DAFTAR';
  // Bersihkan input & pesan error setiap ganti tab biar tidak membingungkan
  document.getElementById('auth-pass').value = '';
  document.getElementById('auth-pass2').value = '';
  setAuthHint('');
};

function setAuthHint(msg) {
  const hint = document.getElementById('auth-hint');
  hint.textContent = msg || '';
  hint.classList.toggle('show', !!msg);
}

window.togglePassVis = function(inputId, btn) {
  const input = document.getElementById(inputId);
  const showing = input.type === 'text';
  input.type = showing ? 'password' : 'text';
  btn.classList.toggle('is-visible', !showing);
};

function mapAuthError(code) {
  const map = {
    'auth/email-already-in-use': 'Email ini sudah terdaftar. Coba masuk saja.',
    'auth/invalid-email': 'Format email tidak valid.',
    'auth/weak-password': 'Sandi minimal 6 karakter.',
    'auth/user-not-found': 'Akun dengan email ini tidak ditemukan.',
    'auth/wrong-password': 'Sandi yang dimasukkan salah.',
    'auth/invalid-credential': 'Email atau sandi salah.',
    'auth/missing-password': 'Sandi belum diisi.',
    'auth/too-many-requests': 'Terlalu banyak percobaan. Coba lagi beberapa saat lagi.',
    'auth/network-request-failed': 'Koneksi internet bermasalah, coba lagi.'
  };
  return map[code] || 'Terjadi kesalahan. Silakan coba lagi.';
}

window.doAuth = async function() {
  if (isBusy) return;
  const email = document.getElementById('auth-email').value.trim();
  const pass = document.getElementById('auth-pass').value;
  setAuthHint('');

  if (!email || !pass) { setAuthHint('Email dan sandi wajib diisi.'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setAuthHint('Format email tidak valid.'); return; }
  if (authMode === 'register' && pass.length < 6) { setAuthHint('Sandi minimal 6 karakter.'); return; }
  if (authMode === 'register' && pass !== document.getElementById('auth-pass2').value) {
    setAuthHint('Ulangi sandi tidak cocok.'); return;
  }

  const btn = document.getElementById('btn-auth-submit');
  isBusy = true;
  btn.disabled = true;
  const originalLabel = btn.textContent;
  btn.textContent = 'MEMPROSES...';

  try {
    if (authMode === 'login') {
      await signInWithEmailAndPassword(auth, email, pass);
    } else {
      await createUserWithEmailAndPassword(auth, email, pass);
    }
  } catch (e) {
    setAuthHint(mapAuthError(e.code));
  } finally {
    isBusy = false;
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
};

// Tekan Enter di kolom email/sandi langsung submit, biar tidak harus tap tombol
['auth-email', 'auth-pass', 'auth-pass2'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); doAuth(); }
  });
});

window.doLogout = async function() {
  // Fade-out layar yang sedang aktif dulu, baru signOut, supaya tidak ada
  // dua animasi (fade-out manual + fade-in dari onAuthStateChanged) yang
  // tabrakan dan terasa "ngedet"/patah-patah.
  const appScrn = document.getElementById('app-screen');
  const pinScrn = document.getElementById('pin-screen');
  const activeScrn = appScrn.style.display !== 'none' ? appScrn : pinScrn;

  activeScrn.classList.add('fade-out');
  await new Promise(r => setTimeout(r, 350));
  activeScrn.style.display = 'none';
  activeScrn.classList.remove('fade-out');

  try {
    await signOut(auth);
  } catch (e) {
    customSwal.fire({ icon: 'error', title: 'Gagal keluar', text: mapAuthError(e.code), background: 'var(--card)', color: 'var(--text)' });
  }
};

onAuthStateChanged(auth, async user => {
  if (user) {
    currentUser = user;
    const authScrn = document.getElementById('auth-screen');
    if (authScrn.style.display !== 'none') {
      authScrn.classList.add('fade-out');
      await new Promise(r => setTimeout(r, 350));
      authScrn.style.display = 'none';
      authScrn.classList.remove('fade-out');
    }

    let secSnap;
    try {
      secSnap = await getDoc(doc(db, 'users', user.uid, 'settings', 'security'));
    } catch (e) {
      customSwal.fire({ icon: 'error', title: 'Koneksi bermasalah', text: 'Tidak bisa memuat data keamanan. Periksa koneksi internet.', background: 'var(--card)', color: 'var(--text)' });
      return;
    }

    const pinScrn = document.getElementById('pin-screen');
    pinScrn.style.display = 'flex';
    pinScrn.classList.add('fade-in');

    if (!secSnap.exists() || !secSnap.data().pin) {
      document.getElementById('pin-title').textContent = 'Buat PIN Baru';
      window.pinMode = 'setup';
    } else {
      window.userCloudPin = secSnap.data().pin;
      document.getElementById('pin-title').textContent = 'Masukkan PIN';
      window.pinMode = 'verify';
    }

    setTimeout(() => {
      pinScrn.classList.remove('fade-in');
      const pinInput = document.getElementById('app-pin');
      pinInput.focus(); pinInput.click();
    }, 450);

  } else {
    currentUser = null;
    photos = [];
    // Kedua layar ini sudah disembunyikan lebih dulu di doLogout(), jadi baris
    // berikut aman sebagai jaga-jaga (misalnya saat sesi habis sendiri).
    document.getElementById('app-screen').style.display = 'none';
    document.getElementById('pin-screen').style.display = 'none';

    document.getElementById('app-pin').value = '';
    document.getElementById('auth-email').value = '';
    document.getElementById('auth-pass').value = '';
    document.getElementById('auth-pass2').value = '';
    setAuthHint('');

    const authScrn = document.getElementById('auth-screen');
    if (authScrn.style.display === 'none' || !authScrn.style.display) {
      authScrn.style.display = 'flex';
      authScrn.classList.add('fade-in');
      setTimeout(() => authScrn.classList.remove('fade-in'), 450);
    }
  }
});

document.getElementById('app-pin').addEventListener('input', async function() {
  // Pastikan hanya angka yang masuk (jaga-jaga di perangkat yang tidak
  // memunculkan keyboard numerik meski inputmode="numeric").
  this.value = this.value.replace(/[^0-9]/g, '');

  if (this.value.length === 6) {
    if (window.pinMode === 'setup') {
      try {
        await setDoc(doc(db, 'users', currentUser.uid, 'settings', 'security'), { pin: this.value }, { merge: true });
        window.userCloudPin = this.value; unlockApp();
      } catch (e) {
        customSwal.fire({ icon: 'error', title: 'Gagal menyimpan PIN', text: 'Periksa koneksi internet lalu coba lagi.', background: 'var(--card)', color: 'var(--text)' });
        this.value = '';
      }
    } else {
      if (this.value === window.userCloudPin) {
        unlockApp();
      } else {
        customSwal.fire({ icon: 'error', title: 'PIN Salah', background: 'var(--card)', color: 'var(--text)', showConfirmButton: false, timer: 1200 });
        this.classList.add('shake');
        setTimeout(() => this.classList.remove('shake'), 500);
        this.value = '';
      }
    }
  }
});

// Transisi Smooth dari PIN ke App
function unlockApp() {
  const pinScrn = document.getElementById('pin-screen');
  const appScrn = document.getElementById('app-screen');

  pinScrn.classList.add('fade-out');
  setTimeout(() => {
    pinScrn.style.display = 'none';
    pinScrn.classList.remove('fade-out');

    appScrn.style.display = 'block';
    appScrn.classList.add('fade-in');

    document.getElementById('app-pin').value = '';
    renderSkeleton();
    listenPhotos();

    setTimeout(() => appScrn.classList.remove('fade-in'), 450);
  }, 350);
}

function renderSkeleton() {
  const container = document.getElementById('main-gallery-grid');

function listenPhotos() {
  const q = query(collection(db, 'users', currentUser.uid, 'photos'), orderBy('createdAt', 'desc'));
  onSnapshot(q, (snap) => {
    photos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderGallery();
  }, (err) => {
    console.error(err);
    customSwal.fire({ icon: 'error', title: 'Gagal memuat foto', text: 'Periksa koneksi internet lalu buka ulang aplikasi.', background: 'var(--card)', color: 'var(--text)' });
  });
}

function renderFilePreview() {

  wrap.innerHTML = selectedFiles.map((f, i) => `

window.removeSelectedFile = function(i) {
  selectedFiles.splice(i, 1);
  const dt = new DataTransfer();
  selectedFiles.forEach(f => dt.items.add(f));
  document.getElementById('f-img-file').files = dt.files;
  renderFilePreview();
};

// Kompres foto di sisi browser sebelum disimpan sebagai base64 di Firestore.
// Ini penting karena satu dokumen Firestore dibatasi ~1MB — tanpa kompresi,
// foto resolusi tinggi dari kamera HP bisa gagal tersimpan.
function compressImage(file, maxDim = 1600, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
          else { width = Math.round(width * (maxDim / height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('Gagal membaca gambar'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Gagal membaca berkas'));
    reader.readAsDataURL(file);
  });
}

window.tambahFotoBaru = async function() {
  if (isBusy) return;
  const customTitle = document.getElementById('f-img-title').value.trim();
  if (!selectedFiles.length) return customSwal.fire({ icon: 'warning', title: 'Kosong', text: 'Pilih foto dulu!', background: 'var(--card)', color: 'var(--text)' });

  isBusy = true;
  const uploadBtn = document.getElementById('btn-upload');
  uploadBtn.disabled = true;

  customSwal.fire({
    title: `Mengupload 0/${selectedFiles.length}...`,
    allowOutsideClick: false, allowEscapeKey: false,
    background: 'var(--card)', color: 'var(--text)',
    didOpen: () => customSwal.showLoading()
  });

  try {
    for (let i = 0; i < selectedFiles.length; i++) {
      customSwal.update({ title: `Mengupload ${i + 1}/${selectedFiles.length}...` });

      let dataUrl = await compressImage(selectedFiles[i]);
      // Kalau masih terlalu besar (foto sangat detail), kompres ulang lebih agresif
      if (dataUrl.length > 900000) {
        dataUrl = await compressImage(selectedFiles[i], 1200, 0.55);
      }

      const finalTitle = customTitle ? (selectedFiles.length > 1 ? `${customTitle} - ${i + 1}` : customTitle) : selectedFiles[i].name;

      await addDoc(collection(db, 'users', currentUser.uid, 'photos'), {
        title: finalTitle, url: dataUrl, createdAt: serverTimestamp()
      });
    }

    customSwal.fire({ icon: 'success', title: 'Upload Sukses', background: 'var(--card)', color: 'var(--text)', timer: 1800, showConfirmButton: false });
    document.getElementById('f-img-file').value = '';
    document.getElementById('f-img-title').value = '';
    selectedFiles = [];
    renderFilePreview();
    switchPage('galeri');
  } catch (e) {
    customSwal.fire({ icon: 'error', title: 'Upload Gagal', text: 'Periksa koneksi internet lalu coba lagi.', background: 'var(--card)', color: 'var(--text)' });
  } finally {
    isBusy = false;
    uploadBtn.disabled = false;
  }
};

function hitungTotalUkuranMB() {
  // Estimasi ukuran asli dari panjang string base64 (base64 ~33% lebih besar dari data aslinya)
  const totalBytes = photos.reduce((sum, p) => sum + (p.url ? p.url.length * 0.75 : 0), 0);
  return (totalBytes / (1024 * 1024)).toFixed(1);
}

function renderGallery() {
  const container = document.getElementById('main-gallery-grid');
  const badge = document.getElementById('photo-count-badge');
  const headerStats = document.getElementById('header-gallery-stats');
  const isGaleriActive = document.getElementById('page-galeri').classList.contains('active');

  if (photos.length === 0) {
    headerStats.classList.remove('show');
    container.innerHTML = `
      <div class="empty-state">
        <span class="emoji">🖼️</span>
        <div class="title">Belum ada foto</div>
        <div class="sub">Tap tombol Upload di bawah untuk menambahkan foto pertamamu.</div>
      </div>`;
    return;
  }

  headerStats.classList.toggle('show', isGaleriActive);
  badge.innerHTML = `${photos.length} foto <span class="badge-size">• ${hitungTotalUkuranMB()} MB</span>`;
  container.innerHTML = photos.map(p => `
    <div class="album-card" onclick="bukaViewer('${p.id}')">
      <img src="${p.url}" class="album-cover" loading="lazy" onload="this.classList.add('loaded')">
    </div>
  `).join('');
}

      customSwal.fire({ icon: 'error', title: 'Gagal mengubah PIN', text: 'Periksa koneksi internet lalu coba lagi.', background: 'var(--card)', color: 'var(--text)' });

/* ==========================================================================

window.bukaViewer = function(id) {
  const foto = photos.find(p => p.id === id);
  if (!foto) return;

  currentViewPhotoId = id;
  const viewer = document.getElementById('photo-viewer');
  const img = document.getElementById('viewer-img');

  document.getElementById('viewer-title-text').textContent = foto.title || '';
  img.classList.remove('loaded', 'zoomed');
  img.src = foto.url;
  viewer.classList.add('show');
};

window.tutupViewer = function() {
  document.getElementById('photo-viewer').classList.remove('show');
  setTimeout(() => {
    document.getElementById('viewer-img').src = '';
    document.getElementById('viewer-img').classList.remove('loaded');
    currentViewPhotoId = null;
  }, 300);
};

window.toggleZoom = function(e) {
  const img = document.getElementById('viewer-img');
  if (img.classList.contains('zoomed')) {
    img.classList.remove('zoomed');
  } else {
    const rect = img.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;
    img.style.transformOrigin = `${x}% ${y}%`;
    img.classList.add('zoomed');
  }
};

window.aksiUnduh = function() {
  const foto = photos.find(p => p.id === currentViewPhotoId);
  if (!foto) return;
  const link = document.createElement('a');
  link.href = foto.url; link.download = (foto.title || 'RHN_Foto') + '.jpg';
  document.body.appendChild(link); link.click(); link.remove();
};

window.aksiHapus = function() {
  konfirmasiAksi('Yakin hapus foto ini permanen?', async () => {
    try {
      await deleteDoc(doc(db, 'users', currentUser.uid, 'photos', currentViewPhotoId));
      tutupViewer();
      customSwal.fire({ icon: 'success', title: 'Terhapus', background: 'var(--card)', color: 'var(--text)', showConfirmButton: false, timer: 1500 });
    } catch (e) {
      customSwal.fire({ icon: 'error', title: 'Gagal menghapus', text: 'Periksa koneksi internet lalu coba lagi.', background: 'var(--card)', color: 'var(--text)' });
    }
  });
};

/* ==========================================================================
   UNDUH SEMUA FOTO LANGSUNG SATU-SATU
   Catatan: sengaja TIDAK di-zip. File .zip masuk ke folder Download biasa
   dan tidak dikenali sebagai foto, jadi tidak muncul di aplikasi Galeri HP.
   Dengan menyimpan tiap foto sebagai file gambar terpisah (.jpg/.png),
   HP akan langsung mengenalinya sebagai foto dan otomatis muncul di Galeri.
   ========================================================================== */
window.downloadAllPhotos = async function() {
  if (!photos.length) return;

  customSwal.fire({
    title: `Menyimpan foto 0/${photos.length}...`,
    text: 'Mohon jangan tutup halaman ini dulu.',
    allowOutsideClick: false, allowEscapeKey: false,
    background: 'var(--card)', color: 'var(--text)',
    didOpen: () => customSwal.showLoading()
  });

  try {
    const usedNames = new Set();

    for (let i = 0; i < photos.length; i++) {
      customSwal.update({ title: `Menyimpan foto ${i + 1}/${photos.length}...` });

      const p = photos[i];
      const ext = p.url.startsWith('data:image/png') ? 'png' : 'jpg';
      let safeName = (p.title || `Foto_${i + 1}`).replace(/[^a-zA-Z0-9_\-\. ]/g, '').trim() || `Foto_${i + 1}`;

      let finalName = `${safeName}.${ext}`;
      let counter = 2;
      while (usedNames.has(finalName)) {
        finalName = `${safeName} (${counter}).${ext}`;
        counter++;
      }
      usedNames.add(finalName);

      const link = document.createElement('a');
      link.href = p.url;
      link.download = finalName;
      document.body.appendChild(link);
      link.click();
      link.remove();

      // Jeda singkat antar unduhan supaya browser tidak memblokir unduhan beruntun
      await new Promise(r => setTimeout(r, 350));
    }

    customSwal.fire({ icon: 'success', title: 'Semua Foto Tersimpan', text: 'Cek aplikasi Galeri / folder Download di HP kamu.', background: 'var(--card)', color: 'var(--text)', timer: 2200, showConfirmButton: false });
  } catch (e) {
    console.error(e);
    customSwal.fire({ icon: 'error', title: 'Gagal Menyimpan', text: 'Coba lagi ya.', background: 'var(--card)', color: 'var(--text)' });
  }
};
