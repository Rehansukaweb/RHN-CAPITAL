<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RHN CAPITAL - Live Terminal Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #050507;
            --bg-surface: #121217;
            --bg-input: #1a1a24;
            --border-color: #272736;
            --text-main: #fcfcfc;
            --text-muted: #8b8b9e;
            --color-profit: #00e676;
            --color-loss: #ff3b30;
            --color-primary: #2962ff;
            --color-brand: #d4af37;
            --flash-up: rgba(0, 230, 118, 0.15);
            --flash-down: rgba(255, 59, 48, 0.15);
            --shadow-glow: 0 0 20px rgba(41, 98, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-base); color: var(--text-main); font-family: 'Inter', sans-serif; padding: 16px; font-size: 13px; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
        .container { max-width: 1300px; margin: 0 auto; width: 100%; }

        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color); }
        .header-title { display: flex; flex-direction: column; gap: 4px; }
        .header h1 { font-size: 20px; font-weight: 800; background: linear-gradient(90deg, #fff, var(--text-muted)); -webkit-background-clip: text; color: transparent; }
        .brand-subtitle { font-size: 10px; font-weight: 700; color: var(--color-brand); letter-spacing: 2px; text-transform: uppercase; }
        
        .live-indicator { display: flex; align-items: center; gap: 8px; font-size: 10px; font-weight: 700; color: var(--color-profit); background: rgba(0, 230, 118, 0.1); padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(0, 230, 118, 0.2); }
        .dot { width: 6px; height: 6px; background-color: var(--color-profit); border-radius: 50%; }
        .dot.active { animation: blink 0.1s; }
        @keyframes blink { 0% { transform: scale(1); } 100% { transform: scale(1.5); } }

        /* Summary Cards */
        .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
        .summary-card { background-color: var(--bg-surface); padding: 16px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: var(--shadow-glow); }
        .summary-card h3 { font-size: 10px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
        .summary-card .value { font-size: 22px; font-weight: 800; font-family: 'JetBrains Mono', monospace; display: block; }
        .summary-card .sub-value { font-size: 12px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; margin-top: 4px; display: block; }

        /* Form */
        .form-container { background-color: var(--bg-surface); padding: 16px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 24px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; align-items: end; }
        .form-group label { font-size: 10px; color: var(--text-muted); margin-bottom: 6px; display: block; font-weight: 600; text-transform: uppercase; }
        .form-group input, .form-group select { background-color: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px; border-radius: 6px; width: 100%; outline: none; font-size: 13px; }
        .btn-add { background: var(--color-primary); color: white; border: none; padding: 10px; border-radius: 6px; font-weight: 700; cursor: pointer; height: 40px; transition: 0.2s; }

        /* Table Responsive */
        .table-container { background-color: var(--bg-surface); border-radius: 12px; border: 1px solid var(--border-color); overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; text-align: right; min-width: 850px; }
        th, td { padding: 14px; border-bottom: 1px solid var(--border-color); }
        th { font-size: 10px; text-transform: uppercase; color: var(--text-muted); background: rgba(0,0,0,0.1); }
        th:first-child, td:first-child { text-align: left; }
        td { font-family: 'JetBrains Mono', monospace; }
        .cell-price { border-radius: 4px; padding: 2px 6px; transition: 0.3s; }

        .text-profit { color: var(--color-profit); }
        .text-loss { color: var(--color-loss); }
        .btn-delete { background: rgba(255, 59, 48, 0.1); color: var(--color-loss); border: 1px solid rgba(255, 59, 48, 0.2); padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 10px; font-weight: 700; }

        @media (max-width: 768px) {
            .summary-grid { grid-template-columns: 1fr; }
            .form-grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 18px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-title">
            <div class="brand-subtitle">RHN CAPITAL FINANCE</div>
            <h1 id="terminal-title">Live Terminal Pro</h1>
        </div>
        <div class="live-indicator">
            <div class="dot" id="tickDot"></div> <span id="wsStatus">SYNCING...</span>
        </div>
    </div>

    <div class="summary-grid">
        <div class="summary-card">
            <h3>Total Portofolio</h3>
            <div class="value" id="totalIDR">Rp 0</div>
            <div class="sub-value" id="totalUSD">$ 0.00</div>
        </div>
        <div class="summary-card">
            <h3>Unrealized PnL</h3>
            <div class="value" id="pnlIDR">Rp 0</div>
            <div class="sub-value" id="pnlUSD">$ 0.00</div>
        </div>
        <div class="summary-card">
            <h3>Return (RoE)</h3>
            <div class="value" id="roePercent">0.00%</div>
            <div class="sub-value" id="rateDisplay">Kurs: Rp 0</div>
        </div>
    </div>

    <div class="form-container">
        <form class="form-grid" id="assetForm">
            <div class="form-group">
                <label>Ticker (TRX/XAU)</label>
                <input type="text" id="assetName" placeholder="Cth: PEPE" required>
            </div>
            <div class="form-group">
                <label>Kategori</label>
                <select id="assetCategory">
                    <option value="Crypto">Crypto</option>
                    <option value="Emas">Emas (Gram)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Volume</label>
                <input type="number" id="assetQuantity" step="any" required>
            </div>
            <div class="form-group">
                <label>Avg. Buy (Rp)</label>
                <input type="number" id="assetBuyPrice" step="any" required>
            </div>
            <button type="submit" class="btn-add">EKSEKUSI POSISI</button>
        </form>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Aset</th>
                    <th>Volume</th>
                    <th>Entry (Rp)</th>
                    <th>Live (Rp)</th>
                    <th>Ekuitas (Rp)</th>
                    <th>PnL (Rp)</th>
                    <th>ROE</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCx04v3ppq3DxbXDg0PrWBeJYIZjmJF9cg",
        authDomain: "rhn-capital.firebaseapp.com",
        projectId: "rhn-capital",
        storageBucket: "rhn-capital.firebasestorage.app",
        messagingSenderId: "74905216682",
        appId: "1:74905216682:web:4687a5b0bd7bcac09292d3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    
    let portfolio = [];
    let usdtToIdrRate = 16000;
    let currentUser = null;

    const formatIDR = (val) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val);
    const formatUSD = (val) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(val);

    // Sync Auth & Data Khusus User (Private Path)
    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('terminal-title').innerText = "Terminal: " + user.email.split('@')[0].toUpperCase();
            listenToData(user.uid);
            initWS();
        } else {
            document.getElementById('wsStatus').innerText = "BELUM LOGIN";
            alert("Silakan login terlebih dahulu!");
        }
    });

    function listenToData(uid) {
        // Path data sekarang masuk ke folder pribadi user
        const q = query(collection(db, "users", uid, "assets"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snap) => {
            portfolio = snap.docs.map(d => ({ id: d.id, ...d.data(), currentPrice: 0 }));
            renderTable();
        });
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = portfolio.map(item => `
            <tr>
                <td><strong>${item.name}</strong></td>
                <td>${item.quantity}</td>
                <td>${formatIDR(item.buyPrice)}</td>
                <td><span class="cell-price" id="price-${item.id}">Loading...</span></td>
                <td id="val-${item.id}">Rp 0</td>
                <td id="pnl-${item.id}">Rp 0</td>
                <td id="roe-${item.id}">0%</td>
                <td><button class="btn-delete" onclick="window.deleteAsset('${item.id}')">TUTUP</button></td>
            </tr>
        `).join('');
    }

    function updateUI() {
        let totalBuy = 0, totalNow = 0;
        portfolio.forEach(item => {
            if (item.currentPrice > 0) {
                const buyVal = item.quantity * item.buyPrice;
                const nowVal = item.quantity * item.currentPrice;
                totalBuy += buyVal;
                totalNow += nowVal;

                const pnl = nowVal - buyVal;
                const roe = (pnl / buyVal) * 100;
                const color = pnl >= 0 ? 'text-profit' : 'text-loss';

                const elPrice = document.getElementById(`price-${item.id}`);
                if (elPrice) {
                    elPrice.innerText = formatIDR(item.currentPrice);
                    document.getElementById(`val-${item.id}`).innerText = formatIDR(nowVal);
                    document.getElementById(`pnl-${item.id}`).innerText = (pnl > 0 ? '+' : '') + formatIDR(pnl);
                    document.getElementById(`pnl-${item.id}`).className = color;
                    document.getElementById(`roe-${item.id}`).innerText = roe.toFixed(2) + '%';
                    document.getElementById(`roe-${item.id}`).className = color;
                }
            }
        });

        const netPnl = totalNow - totalBuy;
        const totalRoe = totalBuy > 0 ? (netPnl / totalBuy) * 100 : 0;

        document.getElementById('totalIDR').innerText = formatIDR(totalNow);
        document.getElementById('totalUSD').innerText = formatUSD(totalNow / usdtToIdrRate);
        document.getElementById('pnlIDR').innerText = (netPnl > 0 ? '+' : '') + formatIDR(netPnl);
        document.getElementById('pnlUSD').innerText = (netPnl > 0 ? '+' : '') + formatUSD(netPnl / usdtToIdrRate);
        document.getElementById('pnlIDR').className = `value ${netPnl >= 0 ? 'text-profit' : 'text-loss'}`;
        document.getElementById('roePercent').innerText = totalRoe.toFixed(2) + '%';
        document.getElementById('roePercent').className = `value ${totalRoe >= 0 ? 'text-profit' : 'text-loss'}`;
        document.getElementById('rateDisplay').innerText = `Kurs: ${formatIDR(usdtToIdrRate)}`;
    }

    // WebSocket Binance (Koin + Kurs Live USDTIDR)
    function initWS() {
        const ws = new WebSocket('wss://stream.binance.com:9443/ws/!miniTicker@arr');
        ws.onmessage = (msg) => {
            const data = JSON.parse(msg.data);
            const dot = document.getElementById('tickDot');
            dot.classList.add('active');
            setTimeout(() => dot.classList.remove('active'), 50);
            document.getElementById('wsStatus').innerText = "MARKET LIVE";

            data.forEach(ticker => {
                if (ticker.s === 'USDTIDR') {
                    usdtToIdrRate = parseFloat(ticker.c);
                }
                portfolio.forEach(item => {
                    const symbol = item.name === 'XAU' ? 'PAXGUSDT' : item.name + 'USDT';
                    if (ticker.s === symbol) {
                        let priceUsd = parseFloat(ticker.c);
                        if (item.name === 'XAU') priceUsd = priceUsd / 31.1034768; 
                        item.currentPrice = priceUsd * usdtToIdrRate;
                    }
                });
            });
            updateUI();
        };
    }

    document.getElementById('assetForm').onsubmit = async (e) => {
        e.preventDefault();
        if(!currentUser) return;
        const name = document.getElementById('assetName').value.toUpperCase();
        await addDoc(collection(db, "users", currentUser.uid, "assets"), {
            name: name,
            category: document.getElementById('assetCategory').value,
            quantity: parseFloat(document.getElementById('assetQuantity').value),
            buyPrice: parseFloat(document.getElementById('assetBuyPrice').value),
            createdAt: serverTimestamp()
        });
        e.target.reset();
    };

    window.deleteAsset = async (id) => { 
        if(confirm("Hapus aset?") && currentUser) {
            await deleteDoc(doc(db, "users", currentUser.uid, "assets", id));
        }
    };
</script>
</body>
</html>
