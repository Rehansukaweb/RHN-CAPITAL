<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Brankas Pribadi — RHN CAPITAL</title>
<link href="[https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700;800&display=swap](https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700;800&display=swap)" rel="stylesheet">
<style>
/* ==========================================================================
RHN VAULT EDITION - PREMIUM SECURE OLED UI
========================================================================== */
 * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
--bg: #050507; --bg2: #0A0A0E; --bg3: #12121A;
--card: #12121A; --card-hover: #16161F;
--border: rgba(255, 255, 255, 0.08); --border-glow: rgba(255, 214, 10, 0.3);
--text: #F8FAFC; --text2: #EBEBF5; --text3: #94A3B8;
--gold: #D4AF37; --gold2: #FFD60A;
--green: #32D74B; --red: #FF6961; --blue: #0A84FF;
--shadow-float: 0 12px 40px rgba(0,0,0,0.8);
--radius: 20px; --radius-sm: 12px;
}
body.light-mode {
--bg: #F2F2F7; --bg2: #FFFFFF; --bg3: #E5E5EA;
--card: #FFFFFF; --card-hover: #F9F9FB;
--border: rgba(0, 0, 0, 0.08); --border-glow: rgba(255, 159, 10, 0.4);
--text: #000000; --text2: #3A3A3C; --text3: #8E8E93;
--gold: #D4AF37; --gold2: #FF9F0A;
}
body {
font-family: 'Outfit', sans-serif; background-color: var(--bg); color: var(--text);
font-size: 15px; line-height: 1.5; min-height: 100vh; overflow-x: hidden;
transition: background-color 0.4s ease, color 0.4s ease;
}
/* LOADER & AUTH */
#auth-screen {
position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 9999;
background-image: radial-gradient(circle at top right, rgba(255, 214, 10, 0.05), transparent 50%);
}
.auth-box {
background: var(--card); border-radius: 32px; padding: 48px 32px; width: 100%; max-width: 400px;
box-shadow: var(--shadow-float); border: 1px solid var(--border); text-align: center; margin: 20px;
}
.auth-logo img { width: 72px; height: 72px; border-radius: 18px; border: 1px solid var(--border); margin-bottom: 16px; object-fit: cover; background: var(--card); }
.auth-title { font-size: 26px; font-weight: 900; color: var(--text); letter-spacing: -1px; margin-bottom: 4px; text-transform: uppercase; }
.auth-sub { font-size: 14px; color: var(--gold2); font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 32px; }
.auth-field input {
width: 100%; padding: 18px 20px; font-size: 16px; font-weight: 600; font-family: 'Outfit', sans-serif;
border: 1px solid var(--border); border-radius: 16px; background: rgba(255,255,255,0.02); color: var(--text);
transition: 0.3s; margin-bottom: 16px; outline: none;
}
body.light-mode .auth-field input { background: rgba(0,0,0,0.02); }
.auth-field input:focus { background: var(--card); border-color: var(--gold2); box-shadow: 0 0 15px var(--border-glow); }
.auth-btn {
width: 100%; padding: 18px; background: var(--gold2); color: #000; border: none; border-radius: 16px;
font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px;
}
.auth-btn:active { transform: scale(0.96); }
.auth-err { background: rgba(255, 69, 58, 0.1); color: var(--red); border-radius: 12px; padding: 14px; font-size: 14px; font-weight: 600; margin-bottom: 20px; display: none; }
/* APP LAYOUT */
#app-screen { display: none; }
.topbar {
background: rgba(5, 5, 7, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
padding: 16px 32px; display: flex; align-items: center; justify-content: space-between;
position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--border);
}
body.light-mode .topbar { background: rgba(255, 255, 255, 0.85); }
.logo-area { display: flex; align-items: center; gap: 16px; }
.logo-area img { width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid rgba(201,168,76,0.5); object-fit: cover; }
.logo-text { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; line-height: 1.2; }
.logo-tag { font-size: 11px; font-weight: 800; color: var(--gold2); text-transform: uppercase; letter-spacing: 2px; }
.top-right { display: flex; align-items: center; gap: 20px; }
.status-badge { display: flex; align-items: center; gap: 6px; background: rgba(50, 215, 75, 0.1); padding: 6px 12px; border-radius: 100px; border: 1px solid rgba(50, 215, 75, 0.2); }
.status-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; box-shadow: 0 0 8px var(--green); }
.status-txt { font-size: 11px; font-weight: 800; color: var(--green); text-transform: uppercase; letter-spacing: 1px; }
/* MAIN CONTAINER */
.main-wrap { padding: 32px; max-width: 1200px; margin: 0 auto; animation: fadeUp 0.5s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
/* FORM INPUT SECURE */
.vault-form {
background: var(--card); border-radius: var(--radius); border: 1px solid var(--border);
padding: 32px; margin-bottom: 32px; box-shadow: 0 8px 32px rgba(0,0,0,0.2);
position: relative; overflow: hidden;
}
.vault-form::before {
content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
background: linear-gradient(90deg, var(--gold2), #FF9F0A);
}
.f-title { font-size: 20px; font-weight: 800; margin-bottom: 24px; display: flex; align-items: center; gap: 10px; }
.f-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.f-group label { display: block; font-size: 12px; font-weight: 800; color: var(--text3); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }
.f-group input, .f-group select, .f-group textarea {
width: 100%; padding: 16px; font-size: 15px; font-weight: 600; font-family: 'Outfit', sans-serif;
background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm);
color: var(--text); outline: none; transition: 0.3s;
}
.f-group input:focus, .f-group select:focus, .f-group textarea:focus { border-color: var(--gold2); background: var(--card); box-shadow: 0 0 0 3px rgba(255, 214, 10, 0.1); }
.f-group textarea { height: 120px; resize: none; font-family: 'JetBrains Mono', monospace; font-size: 14px; }
.btn-save {
background: var(--text); color: var(--bg); padding: 16px 32px; border: none; border-radius: var(--radius-sm);
font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: 0.2s;
width: 100%; margin-top: 8px;
}
.btn-save:active { transform: scale(0.98); }
/* GRID DATA PRIBADI (PINTEREST / MASONRY STYLE) */
.vault-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.vh-title { font-size: 20px; font-weight: 800; }
.search-box {
padding: 12px 20px; border-radius: 100px; border: 1px solid var(--border); background: var(--card);
color: var(--text); font-family: 'Outfit', sans-serif; font-size: 14px; width: 300px; outline: none; font-weight: 600;
}
.search-box:focus { border-color: var(--gold2); }
.data-grid {
display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px;
}
.d-card {
background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
padding: 24px; transition: 0.3s; position: relative;
}
.d-card:hover { border-color: var(--gold2); transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.3); }
.d-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
.d-cat {
font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px;
padding: 4px 10px; border-radius: 6px; background: rgba(255, 214, 10, 0.15); color: var(--gold2);
}
.d-date { font-size: 11px; font-weight: 600; color: var(--text3); }
.d-title { font-size: 18px; font-weight: 800; color: var(--text); margin-bottom: 12px; line-height: 1.3; word-wrap: break-word; }
.d-content {
font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; color: var(--text2);
background: var(--bg2); padding: 16px; border-radius: var(--radius-sm); border: 1px solid var(--border);
white-space: pre-wrap; word-wrap: break-word; max-height: 200px; overflow-y: auto; scrollbar-width: none;
}
.d-content::-webkit-scrollbar { display: none; }
.d-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
.d-btn {
background: transparent; border: 1px solid var(--border); color: var(--text); padding: 8px 16px;
border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px;
}
.d-btn:hover { background: var(--text); color: var(--bg); }
.d-btn.del { border-color: transparent; color: var(--red); }
.d-btn.del:hover { background: rgba(255, 105, 97, 0.1); color: var(--red); }
.empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text3); font-weight: 600; background: var(--card); border-radius: var(--radius); border: 1px dashed var(--border); }
/* MOBILE RESPONSIVE TIGHT GRID */
@media (max-width: 768px) {
body { padding: 0; }
.topbar { padding: 16px; flex-wrap: wrap; gap: 12px; }
.top-right { width: 100%; justify-content: space-between; }
.main-wrap { padding: 16px; }
.vault-form { padding: 20px; border-radius: 20px; }
.f-grid { grid-template-columns: 1fr; gap: 16px; }
.f-group input, .f-group select, .f-group textarea { padding: 14px; font-size: 14px; }
.vault-header { flex-direction: column; align-items: flex-start; gap: 12px; }
.search-box { width: 100%; }
/* DATA GRID MOBILE MENTOK */
.data-grid { grid-template-columns: 1fr; gap: 16px; }
.d-card { padding: 20px; border-radius: 20px; }
}
/* NOTIF TOAST */
#toast {
position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
background: var(--text); color: var(--bg); padding: 12px 24px; border-radius: 100px;
font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
box-shadow: 0 10px 30px rgba(0,0,0,0.5); opacity: 0; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 9999;
}
#toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>
<div id="auth-screen">
<div class="auth-box">
<div class="auth-logo"><img src="RHN LOGO.jpg" alt="RHN Logo" onerror="this.style.display='none'"></div>
<div class="auth-title">BRANKAS PRIBADI</div>
<div class="auth-sub">RHN CAPITAL FINANCE</div>
<div id="auth-err" class="auth-err"></div>
<div class="auth-field"><input type="email" id="auth-email" placeholder="Email Terdaftar" autocomplete="email"></div>
<div class="auth-field"><input type="password" id="auth-pass" placeholder="Kata Sandi Keamanan" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
<button class="auth-btn" id="btn-login" onclick="doLogin()">Buka Brankas 🔓</button>
</div>
</div>
<div id="app-screen">
<div class="topbar">
<div class="logo-area">
<img src="RHN LOGO.jpg" alt="RHN Logo" onerror="this.style.display='none'">
<div>
<div class="logo-text">RHN BRANKAS</div>
<div class="logo-tag">Penyimpanan Terenkripsi</div>
</div>
</div>
<div class="top-right">
<div class="status-badge">
<div class="status-dot" id="sync-dot"></div>
<div class="status-txt" id="sync-txt">SINKRON</div>
</div>
<button onclick="toggleTheme()" style="background:var(--card); border:1px solid var(--border); color:var(--text); padding:8px; border-radius:8px; cursor:pointer;" id="theme-btn">🌙</button>
<button onclick="doLogout()" style="background:transparent; border:none; color:var(--red); font-weight:800; font-family:'Outfit'; cursor:pointer; text-transform:uppercase;">TUTUP ✕</button>
</div>
</div>
<div class="main-wrap">
<div class="vault-form">
<div class="f-title">✦ Masukkan Data Baru</div>
<div class="f-grid">
<div class="f-group">
<label>Judul Informasi</label>
<input type="text" id="v-title" placeholder="Cth: Sandi Trading MT5, Rekening BCA, dll...">
</div>
<div class="f-group">
<label>Kategori</label>
<select id="v-cat">
<option value="Akun & Sandi">Akun & Sandi</option>
<option value="Data Finansial">Data Finansial</option>
<option value="Catatan Rahasia">Catatan Rahasia</option>
<option value="Dokumen Klien">Dokumen Klien</option>
<option value="Lainnya">Lainnya</option>
</select>
</div>
</div>
<div class="f-group">
<label>Isi Data / Keterangan</label>
<textarea id="v-content" placeholder="Ketik atau paste data rahasia di sini..."></textarea>
</div>
<button class="btn-save" id="btn-save" onclick="saveData()">Simpan ke Brankas</button>
</div>
<div class="vault-header">
<div class="vh-title">Data Tersimpan</div>
<input type="text" class="search-box" id="v-search" placeholder="Cari data..." oninput="renderVault()">
</div>
<div class="data-grid" id="vault-grid">
</div>
</div>
</div>
<div id="toast">Data disalin!</div>
<script type="module">
window.toggleTheme = function() {
document.body.classList.toggle('light-mode');
const isLight = document.body.classList.contains('light-mode');
document.getElementById('theme-btn').textContent = isLight ? '🌙' : '☀️';
localStorage.setItem('themeVault', isLight ? 'light' : 'dark');
};
if(localStorage.getItem('themeVault') === 'light') {
document.body.classList.add('light-mode');
document.getElementById('theme-btn').textContent = '🌙';
}
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
apiKey: "AIzaSyCx04v3ppq3DxbXDg0PrWBeJYIZjmJF9cg",
authDomain: "rhn-capital.firebaseapp.com",
projectId: "rhn-capital",
storageBucket: "rhn-capital.firebasestorage.app",
messagingSenderId: "74905216682",
appId: "1:74905216682:web:4687a5b0bd7bcac09292d3"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let vaultData = [];
let currentUser = null;
let unsubListener = null;
function showToast(msg) {
const t = document.getElementById('toast');
t.textContent = msg; t.classList.add('show');
setTimeout(() => t.classList.remove('show'), 2500);
}
function setSync(ok) {
document.getElementById('sync-dot').style.background = ok ? 'var(--green)' : 'var(--red)';
document.getElementById('sync-dot').style.boxShadow = ok ? '0 0 8px var(--green)' : '0 0 8px var(--red)';
document.getElementById('sync-txt').textContent = ok ? 'SINKRON' : 'OFFLINE';
document.getElementById('sync-txt').style.color = ok ? 'var(--green)' : 'var(--red)';
}
window.doLogin = async function() {
const e = document.getElementById('auth-email').value.trim();
const p = document.getElementById('auth-pass').value;
const err = document.getElementById('auth-err');
if(!e || !p) { err.textContent='Isi email dan sandi!'; err.style.display='block'; return; }
document.getElementById('btn-login').textContent = 'Membuka...';
try {
await signInWithEmailAndPassword(auth, e, p);
err.style.display='none';
} catch(ex) {
err.textContent = 'Gagal: Akses Ditolak!'; err.style.display='block';
document.getElementById('btn-login').textContent = 'Buka Brankas 🔓';
}
}
window.doLogout = async function() {
if(confirm('Kunci kembali brankas ini?')) {
if(unsubListener) unsubListener();
vaultData = [];
await signOut(auth);
}
}
onAuthStateChanged(auth, user => {
if(user) {
currentUser = user;
document.getElementById('auth-screen').style.display='none';
document.getElementById('app-screen').style.display='block';
listenData(user.uid);
} else {
currentUser = null;
document.getElementById('auth-screen').style.display='flex';
document.getElementById('app-screen').style.display='none';
document.getElementById('btn-login').textContent = 'Buka Brankas 🔓';
document.getElementById('auth-pass').value = '';
}
});
function listenData(uid) {
const q = query(collection(db, 'users', uid, 'personal_data'), orderBy('createdAt', 'desc'));
unsubListener = onSnapshot(q, snap => {
vaultData = snap.docs.map(d => ({id: d.id, ...d.data()}));
setSync(true); renderVault();
}, err => { console.error(err); setSync(false); });
}
window.saveData = async function() {
if(!currentUser) return;
const title = document.getElementById('v-title').value.trim();
const cat = document.getElementById('v-cat').value;
const content = document.getElementById('v-content').value.trim();
if(!title || !content) { alert('Judul dan Isi data wajib diisi!'); return; }
const btn = document.getElementById('btn-save');
btn.textContent = 'Menyimpan...'; btn.disabled = true;
try {
await addDoc(collection(db, 'users', currentUser.uid, 'personal_data'), {
title, category: cat, content,
date: new Date().toISOString(),
createdAt: serverTimestamp()
});
document.getElementById('v-title').value = '';
document.getElementById('v-content').value = '';
showToast('Data berhasil diamankan!');
} catch(e) { alert('Gagal menyimpan: '+e.message); }
btn.textContent = 'Simpan ke Brankas'; btn.disabled = false;
}
window.delData = async function(id) {
if(!currentUser || !confirm('Hapus data ini secara permanen?')) return;
try { await deleteDoc(doc(db, 'users', currentUser.uid, 'personal_data', id)); showToast('Data dihapus'); }
catch(e) { alert('Gagal menghapus'); }
}
window.copyData = function(id) {
const d = vaultData.find(x => x.id === id);
if(d) {
navigator.clipboard.writeText(d.content).then(() => showToast('Disalin ke Clipboard!'));
}
}
window.renderVault = function() {
const grid = document.getElementById('vault-grid');
const term = document.getElementById('v-search').value.toLowerCase();
let arr = vaultData;
if(term) {
arr = arr.filter(d => d.title.toLowerCase().includes(term) || d.category.toLowerCase().includes(term) || d.content.toLowerCase().includes(term));
}
if(arr.length === 0) {
grid.innerHTML = <div class="empty-state">Brankas kosong atau data tidak ditemukan.</div>;
return;
}
grid.innerHTML = arr.map(d => {
const dt = new Date(d.date).toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'});
return  <div class="d-card"> <div class="d-head"> <span class="d-cat">${d.category}</span> <span class="d-date">${dt}</span> </div> <div class="d-title">${d.title}</div> <div class="d-content">${d.content}</div> <div class="d-foot"> <button class="d-btn" onclick="copyData('${d.id}')">📋 Salin Data</button> <button class="d-btn del" onclick="delData('${d.id}')">Hapus</button> </div> </div>;
}).join('');
}
</script>
</body>
</html>
